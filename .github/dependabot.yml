version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: [ "*" ]

  - package-ecosystem: "npm"
    directory: "/fegui"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns: [ "*" ]

  - package-ecosystem: "sbt"
    directory: [ "/beapi", "/beapi/hexagon/*" ]
    schedule:
      interval: "weekly"
    groups:
      sbt:
        patterns: [ "*" ]
    ignore:
      # pinned to the Scala 3.9 LTS line on purpose; bump minor versions manually
      - dependency-name: "org.scala-lang:scala3-library_3"
        update-types: [ "version-update:semver-minor", "version-update:semver-major" ]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns: [ "*" ]
    ignore:
      # pinned to the LTS lines on purpose (Node 24, JDK 25); bump major versions manually
      - dependency-name: "node"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "eclipse-temurin"
        update-types: [ "version-update:semver-major" ]
